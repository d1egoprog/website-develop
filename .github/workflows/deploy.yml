name: Build & Deploy Astro Site

on:
  push:
    branches:
      - main          # or your deployment branch
  workflow_dispatch:   # allows manual run

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push to gh‑pages

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for git tags

      # 2️⃣ Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'   # Astro 4+ works with Node 18+

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Build the site
      - name: Build site
        run: npm run build

      # 5️⃣ Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist          # default output folder for Astro
          publish_branch: gh-pages     # branch that GitHub Pages serves
          # If you want to keep the build in a sub‑folder:
          # publish_dir: ./dist
          # publish_branch: gh-pages